[project]
name = "synera-agent"
version = "0.1.0"
description = "Talk to Your Building: agent with deterministic tools (Industrial Agents Hackathon 2026, Track 01)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_agent", "benchmark", "building_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the Claude API (needs .env, costs money); run with -m live"]

[tool.ruff]
line-length = 120
extend-exclude = ["starter_agent", "benchmark", "data"]
