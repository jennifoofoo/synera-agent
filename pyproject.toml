[project]
name = "synera-agent"
version = "0.1.0"
description = "Talk to Your Building: agent with deterministic tools (Industrial Agents Hackathon 2026, Track 01)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=1.26",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.2",
]
# Optional, not installed by default: mobile smoke tests (uv sync --group e2e; playwright install chromium webkit)
e2e = [
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_agent", "benchmark", "building_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not e2e'"
markers = [
    "live: talks to the Claude API (needs .env, costs money); run with -m live",
    "e2e: mobile browser tests with Playwright (uv sync --group e2e); run with -m e2e",
]

[tool.ruff]
line-length = 120
extend-exclude = ["starter_agent", "benchmark", "data"]
